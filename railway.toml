# Railway.app Configuration
# For deploying to Railway platform with multi-environment support

[build]
builder = "NIXPACKS"
buildCommand = "pip install -e . && pip install -r requirements.txt"

[deploy]
startCommand = "streamlit run streamlit_backroom.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --server.enableCORS=true"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 30
sleepForOrKillAppTimeout = 60

[healthcheck]
path = "/_stcore/health"
timeout = 10
interval = 30
gracePeriod = 10

# Environment variables
[variables]
NODE_ENV = "production"
PYTHONPATH = "/app"
STREAMLIT_SERVER_HEADLESS = "true"
STREAMLIT_SERVER_ENABLE_CORS = "true"
STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION = "true"
