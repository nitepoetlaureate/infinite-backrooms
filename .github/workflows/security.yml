name: Security Scan

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev]"

    - name: Run Bandit security linter
      run: |
        echo "Running Bandit security scan..."
        bandit -r . -f json -o bandit-report.json -ll || true
        bandit -r . -f screen -ll
      continue-on-error: true

    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json

    - name: Run Safety check for vulnerable dependencies
      run: |
        echo "Checking for vulnerable dependencies..."
        safety check --json > safety-report.json || true
        safety check || true
      continue-on-error: true

    - name: Upload Safety report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: safety-security-report
        path: safety-report.json

    - name: Analyze dependencies
      run: |
        echo "Analyzing dependencies..."
        uv pip list --format=json > dependencies.json || true
        cat dependencies.json

    - name: Upload dependencies list
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependencies-list
        path: dependencies.json

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: moderate

  notify-security-issues:
    runs-on: ubuntu-latest
    needs: [security-scan, codeql-analysis]
    if: always() && (needs.security-scan.result == 'failure' || needs.codeql-analysis.result == 'failure')

    steps:
    - name: Security scan failed notification
      run: |
        echo "⚠️ Security scan detected issues"
        echo "Please review the security reports"
        echo "Security Scan: ${{ needs.security-scan.result }}"
        echo "CodeQL: ${{ needs.codeql-analysis.result }}"
