name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      force_deploy:
        description: 'Force deployment (skip tests)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '18'
  CONTAINER_REGISTRY: ghcr.io
  APP_NAME: 'infinite-backrooms'

# Global permissions for security scanning and OIDC
permissions:
  contents: read
  packages: write
  security-events: write
  actions: read
  id-token: write

jobs:
  # === Security & Compliance ===
  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety semgrep

    - name: Run Bandit security linter
      run: bandit -r src/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Run Safety dependency check
      run: safety check --json --output safety-report.json
      continue-on-error: true

    - name: Run Semgrep security scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
          p/python
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  # === Code Quality & Testing ===
  quality-check:
    runs-on: ubuntu-latest
    name: Code Quality & Tests
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run type checking
      run: mypy src/ --ignore-missing-imports

    - name: Run code formatting check
      run: |
        black --check --diff src/ tests/
        ruff check src/ tests/

    - name: Run unit tests with coverage
      run: |
        pytest --cov=src --cov-report=xml --cov-report=html -v
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Run integration tests (selected)
      run: |
        pytest -m "integration and not slow" -v --tb=short
      env:
        OLLAMA_BASE_URL: http://localhost:11434
      continue-on-error: true

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.xml
          .coverage

  # === Performance & Load Testing ===
  performance-test:
    runs-on: ubuntu-latest
    name: Performance Testing
    needs: quality-check
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install locust pytest-benchmark

    - name: Run performance benchmarks
      run: |
        python scripts/benchmark_performance.py
        pytest --benchmark-only --benchmark-json=benchmark.json
      continue-on-error: true

    - name: Upload performance reports
      uses: actions/upload-artifact@v4
      with:
        name: performance-reports
        path: benchmark.json

  # === Container Build & Security ===
  build-container:
    runs-on: ubuntu-latest
    name: Build & Secure Container
    needs: [security-scan, quality-check]
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.CONTAINER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.CONTAINER_REGISTRY }}/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push container image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        provenance: true
        sbom: true

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.CONTAINER_REGISTRY }}/${{ github.repository }}@${{ steps.build.outputs.digest }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # === Staging Deployment ===
  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    needs: build-container
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment == 'staging')
    environment:
      name: staging
      url: https://infinite-backrooms-staging.onrender.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Railway (Staging)
      uses: railway/railway-action@v1
      with:
        railway-token: ${{ secrets.RAILWAY_TOKEN }}
        service: ${{ secrets.RAILWAY_STAGING_SERVICE }}
        command: up
      continue-on-error: true

    - name: Deploy to Render (Staging)
      run: |
        curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"
      continue-on-error: true

    - name: Run health checks
      run: |
        timeout 300 bash -c 'until curl -f https://infinite-backrooms-staging.onrender.com/health; do sleep 10; done'
      continue-on-error: true

    - name: Run smoke tests
      run: |
        python scripts/health_check.py --base-url https://infinite-backrooms-staging.onrender.com
      continue-on-error: true

    - name: Run performance validation
      run: |
        python scripts/deploy_check.sh --environment staging
      continue-on-error: true

  # === Production Deployment ===
  deploy-production:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: build-container
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment == 'production')
    environment:
      name: production
      url: https://infinite-backrooms.onrender.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Pre-deployment verification
      run: |
        echo "🚀 Starting production deployment..."
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Image: ${{ needs.build-container.outputs.image-tag }}"

    - name: Create deployment notification
      run: |
        if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"🚀 Starting production deployment of infinite-backrooms (commit: ${{ github.sha }})"}' \
            "${{ secrets.SLACK_WEBHOOK }}"
        fi

    - name: Blue-Green Deployment to Production
      run: |
        # This would implement blue-green deployment strategy
        # For now, we'll use the platform's deployment hooks
        echo "Executing blue-green deployment..."

    - name: Deploy to Railway (Production)
      uses: railway/railway-action@v1
      with:
        railway-token: ${{ secrets.RAILWAY_TOKEN }}
        service: ${{ secrets.RAILWAY_PRODUCTION_SERVICE }}
        command: up

    - name: Deploy to Render (Production)
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

    - name: Wait for deployment and run health checks
      timeout-minutes: 10
      run: |
        echo "⏳ Waiting for deployment to complete..."

        # Wait for application to be responsive
        attempts=0
        max_attempts=30
        until curl -f https://infinite-backrooms.onrender.com/health || [ $attempts -eq $max_attempts ]; do
          echo "Attempt $((attempts + 1))/$max_attempts: Waiting for health check..."
          sleep 20
          attempts=$((attempts + 1))
        done

        if [ $attempts -eq $max_attempts ]; then
          echo "❌ Health check failed after maximum attempts"
          exit 1
        fi

        echo "✅ Health check passed"

    - name: Run production smoke tests
      run: |
        python scripts/health_check.py --base-url https://infinite-backrooms.onrender.com --production

    - name: Run performance validation
      run: |
        python scripts/deploy_check.sh --environment production

    - name: Post-deployment notification
      if: always()
      run: |
        if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
          status="✅ Successful"
          if [ "${{ job.status }}" != "success" ]; then
            status="❌ Failed"
          fi
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$status Production deployment of infinite-backrooms (commit: ${{ github.sha }})\"}" \
            "${{ secrets.SLACK_WEBHOOK }}"
        fi

  # === Cleanup & Maintenance ===
  cleanup:
    runs-on: ubuntu-latest
    name: Cleanup & Maintenance
    needs: [deploy-staging, deploy-production]
    if: always()

    steps:
    - name: Cleanup old container images
      uses: actions/delete-package-versions@v4
      with:
        package-name: 'infinite-backrooms'
        package-type: 'container'
        delete-only-untagged-versions: true
        min-versions-to-keep: 10

    - name: Update deployment status
      if: always()
      run: |
        echo "Pipeline completed with status: ${{ job.status }}"
        echo "Deployment summary:"
        echo "- Security scan: ${{ needs.security-scan.result }}"
        echo "- Quality check: ${{ needs.quality-check.result }}"
        echo "- Container build: ${{ needs.build-container.result }}"
        echo "- Staging deploy: ${{ needs.deploy-staging.result }}"
        echo "- Production deploy: ${{ needs.deploy-production.result }}"

  # === Documentation Update ===
  update-docs:
    runs-on: ubuntu-latest
    name: Update Documentation
    needs: [build-container]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update version information
      run: |
        # Update version in documentation
        echo "Last updated: $(date)" >> docs/DEPLOYMENT.md
        echo "Latest commit: ${{ github.sha }}" >> docs/DEPLOYMENT.md

    - name: Commit documentation updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/
        git diff --staged --quiet || git commit -m "docs: Update deployment information [skip ci]"
        git push