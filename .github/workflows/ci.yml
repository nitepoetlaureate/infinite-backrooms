name: CI

on:
  push:
    branches: [ main, develop, "claude/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Code quality checks
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync

      - name: Check code formatting
        run: |
          uv run ruff format --check .
        continue-on-error: true

      - name: Lint code
        run: |
          uv run ruff check .
        continue-on-error: true

  # Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run security scan
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json

  # Build Docker image
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: infinite-backrooms:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Integration test
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync

      - name: Test imports
        run: |
          uv run python -c "import streamlit_backroom; print('✓ Main app imports successfully')"
          uv run python -c "import log_viewer; print('✓ Log viewer imports successfully')"
          uv run python -c "import async_utils; print('✓ Async utils imports successfully')"
          uv run python -c "import constants; print('✓ Constants imports successfully')"
          uv run python -c "import roles; print('✓ Roles imports successfully')"
          uv run python -c "import validators; print('✓ Validators imports successfully')"

      - name: Verify file structure
        run: |
          test -f streamlit_backroom.py || exit 1
          test -f log_viewer.py || exit 1
          test -f async_utils.py || exit 1
          test -f constants.py || exit 1
          test -f roles.py || exit 1
          test -f validators.py || exit 1
          test -f Dockerfile || exit 1
          test -f docker-compose.yml || exit 1
          test -f .env.example || exit 1
          echo "✓ All required files present"

  # Summary job
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, security, docker, integration]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "⚠️  Lint job failed or was skipped"
          fi
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "⚠️  Security job failed or was skipped"
          fi
          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "❌ Docker build failed!"
            exit 1
          fi
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "❌ Integration test failed!"
            exit 1
          fi
          echo "✅ All critical CI checks passed!"
