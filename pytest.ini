[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    --asyncio-mode=auto
    -m "not integration"

# Custom markers
markers =
    integration: marks tests as integration tests requiring live Ollama
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: marks tests as unit tests
    security: marks tests as security-focused tests
    ui: marks tests as UI component tests
    performance: marks tests as performance tests
    async_test: marks tests that use asyncio

# Minimum test version
minversion = 7.0

# Test execution timeout (in seconds)
timeout = 300

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    error:::.*infinite_backrooms.*

# Asyncio configuration
asyncio_mode = auto

# Coverage configuration (additional settings)
# Note: Main coverage settings are in pyproject.toml